<style>
:root{
  --black:#000; --ink:#2C3439; --mute:#667078; --line:#E2E7EA; --paper:#fff; --mist:#EEF7FB; --fog:#F5F7F8;
  --cyan:#00AEEF; --cyan-ink:#00719A; --sky:#86CEF4; --ember:#E8590C; --ember-ink:#A93F06; --ember-mist:#FDEFE6; --leaf:#167A4E; --leaf-mist:#E7F5EE;
  --disp:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',Arial,sans-serif;
  --r-xl:28px; --r-m:16px; --r-s:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);color:var(--black);margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.02}
h1{font-size:clamp(40px,5.4vw,68px)}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 28px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer}
.brand img{width:52px;height:52px;display:block}
.brand span{font-family:var(--disp);font-weight:600;font-size:19px;color:var(--black);white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{position:relative;display:flex;align-items:center;gap:8px;background:none;border:0;padding:20px 14px;color:var(--mute);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--black)}
.nav button[aria-current="page"]{color:var(--black)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--cyan)}
.langs{display:flex;gap:2px}
.langs button{border:0;background:none;padding:6px 7px;font-size:13px;font-weight:700;color:#9AA3A9;cursor:pointer;letter-spacing:.02em}
.langs button[aria-pressed="true"]{color:var(--black);text-decoration:underline;text-decoration-color:var(--cyan);text-decoration-thickness:3px;text-underline-offset:6px}
.me{width:40px;height:40px;border-radius:50%;background:var(--black);color:#fff;border:0;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0}
.ml{margin-left:auto}

/* Layout */
.page{max-width:1180px;margin:0 auto;padding:56px 28px 96px}
.stack{display:flex;flex-direction:column}
.g-s{gap:8px}.g-m{gap:16px}.g-l{gap:28px}.g-xl{gap:64px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:14px}
.lead{font-size:19px;color:var(--ink);max-width:56ch}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-p{background:var(--cyan);color:var(--black)}
.btn-p:hover{background:#33C0F3}
.btn-k{background:var(--black);color:#fff}
.btn-k:hover{background:#262B2F}
.btn-o{background:transparent;color:var(--black);border-color:var(--black)}
.btn-o:hover{background:var(--fog)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--cyan-ink);font-weight:700;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--mute);font-weight:600;cursor:pointer;margin-bottom:28px}
.back:hover{color:var(--black)}

/* Fields & controls */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:600;color:var(--black)}
.field input,.field textarea{min-height:52px;border:1.5px solid #CBD3D8;border-radius:var(--r-s);padding:12px 16px;background:#fff;color:var(--black)}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--black);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid #CBD3D8;background:#fff;border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button:hover{border-color:var(--black)}
.seg button[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.seg button[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;background:var(--fog);color:var(--ink);white-space:nowrap}
.tag.c{background:var(--mist);color:var(--cyan-ink)}
.tag.e{background:var(--ember-mist);color:var(--ember-ink)}
.tag.l{background:var(--leaf-mist);color:var(--leaf)}

/* Landing */
.land{max-width:1180px;margin:0 auto;padding:40px 28px 80px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:64px;align-items:start;position:relative}
.land .intro{padding-top:24px;display:flex;flex-direction:column;gap:28px;position:relative}
.land .intro .bigmark{width:132px;height:132px}
.land h1{max-width:13ch}
.why{list-style:none;margin:18px 0 0;padding:28px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 36px}
.why li{display:flex;flex-direction:column;gap:6px}
.why b{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--black);line-height:1.15}
.why span{color:var(--mute);font-size:15px}
.why svg{color:var(--cyan-ink);margin-bottom:4px}
.authbox{background:var(--fog);border-radius:var(--r-xl);padding:36px;display:flex;flex-direction:column;gap:18px;position:sticky;top:96px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:0 0 12px;font-family:var(--disp);font-size:22px;font-weight:600;color:#9AA3A9;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--black)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--cyan);border-radius:3px}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#D7DEE2}

/* Plans */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--black);border-radius:var(--r-xl);overflow:hidden}
.plan{padding:36px 32px;display:flex;flex-direction:column;gap:20px;position:relative}
.plan + .plan{border-left:1.5px solid var(--black)}
.plan.hi{background:var(--black);color:#fff}
.plan.hi h3,.plan.hi .price{color:#fff}
.plan .price{font-family:var(--disp);font-weight:700;font-size:60px;line-height:.9;color:var(--black)}
.plan .per{font-size:15px;color:var(--mute)}
.plan.hi .per{color:#AEB8BE}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;flex:1}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{flex-shrink:0;margin-top:3px;color:var(--cyan)}
.plan .flag{position:absolute;top:20px;right:20px}
.vrline{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}

/* Sector tiles */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-m);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;font-weight:600;color:var(--black);min-height:64px;font-size:15px;line-height:1.25}
.tile svg{flex-shrink:0;color:var(--cyan-ink)}
.tile:hover{border-color:#AEB8BE}
.tile[aria-pressed="true"]{border-color:var(--black);background:var(--black);color:#fff}
.tile[aria-pressed="true"] svg{color:var(--cyan)}
.chipbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 16px;font-weight:600;color:var(--ink);cursor:pointer;font-size:15px}
.chipbtn[aria-pressed="true"]{border-color:var(--cyan-ink);background:var(--mist);color:var(--cyan-ink)}

/* Today */
.count{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:48px;align-items:center;padding-bottom:56px;border-bottom:1px solid var(--line)}
.days{font-family:var(--disp);font-weight:700;color:var(--black);font-size:clamp(96px,14vw,184px);line-height:.8;letter-spacing:-.04em}
.days small{font-size:.32em;letter-spacing:-.01em;margin-left:.12em;font-weight:600}
.count .what{font-size:22px;color:var(--ink);margin-top:20px;max-width:38ch;line-height:1.3}
.count .what b{color:var(--black);font-weight:600}
.ready{display:flex;align-items:center;gap:28px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.legend li{display:grid;grid-template-columns:14px auto;column-gap:10px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%}
.legend b{font-family:var(--disp);font-size:26px;color:var(--black);font-weight:600;line-height:1}
.legend span{grid-column:2;font-size:14px;color:var(--mute)}
.arcs circle.v{transition:stroke-dasharray .4s}
.draw circle.v{animation:draw 1.1s cubic-bezier(.2,.7,.2,1) both}
.draw circle.v:nth-of-type(4){animation-delay:.12s}.draw circle.v:nth-of-type(6){animation-delay:.24s}
@keyframes draw{from{stroke-dasharray:0 2000}}
@media (prefers-reduced-motion:reduce){.draw circle.v{animation:none}}

.rehearse{background:var(--black);color:#fff;border-radius:var(--r-xl);padding:48px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:center;position:relative;overflow:hidden}
.rehearse h2{color:#fff;font-size:44px}
.rehearse .k{color:#AEB8BE;font-size:15px}
.rehearse dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:22px 0 0;font-size:17px;max-width:560px}
.rehearse dt{color:#AEB8BE}
.rehearse dd{margin:0;color:#fff}
.rehearse .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.rehearse .acts .btn-o{color:#fff;border-color:#4A5459}
.rehearse .acts .btn-o:hover{background:#1A1F22}
.rehearse svg.deco{width:280px;height:280px;display:block}

.timeline{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);overflow-x:auto;padding-bottom:6px}
.timeline li{position:relative;padding:34px 12px 0 0;display:flex;flex-direction:column;gap:4px}
.timeline li::before{content:"";position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line)}
.timeline li.done::before{background:var(--black)}
.timeline .pt{position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #C3CBD0;display:flex;align-items:center;justify-content:center;color:#fff}
.timeline li.done .pt{background:var(--black);border-color:var(--black)}
.timeline li.next .pt{border-color:var(--cyan);border-width:6px}
.timeline li.day .pt{background:var(--black);border:6px solid var(--cyan);width:26px;height:26px;top:-2px;left:-2px}
.timeline .d{font-size:13px;color:var(--mute);font-weight:600}
.timeline b{font-family:var(--disp);font-size:17px;font-weight:600;color:var(--black);line-height:1.15}
.timeline li.next b{color:var(--cyan-ink)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.drow:last-child{border-bottom:1px solid var(--line)}
.drow:hover b{color:var(--cyan-ink)}
.drow .ico{width:44px;height:44px;border-radius:12px;background:var(--fog);display:flex;align-items:center;justify-content:center;color:var(--black)}
.drow b{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--black);display:block;line-height:1.2}
.drow .sc{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--black)}

/* Scenarios */
.sclayout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start}
.sclist{display:flex;flex-direction:column}
.scn{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:20px;align-items:start;padding:22px 20px;border-radius:var(--r-m);background:none;border:1.5px solid transparent;cursor:pointer;text-align:left;width:100%;color:inherit}
.scn + .scn{margin-top:4px}
.scn:hover{background:var(--fog)}
.scn[aria-pressed="true"]{border-color:var(--black);background:#fff}
.scn .ico{width:52px;height:52px;border-radius:14px;background:var(--mist);color:var(--cyan-ink);display:flex;align-items:center;justify-content:center}
.scn[aria-pressed="true"] .ico{background:var(--black);color:var(--cyan)}
.scn b{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--black);display:block;line-height:1.15;margin-bottom:6px}
.scn p{font-size:15px;color:var(--mute)}
.scn p em{font-style:normal;color:var(--ink)}
.scn[disabled]{cursor:not-allowed;opacity:.55}
.scn[disabled]:hover{background:none}
.scn .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:14px;color:var(--mute);white-space:nowrap}
.setup{position:sticky;top:96px;background:var(--fog);border-radius:var(--r-xl);padding:32px;display:flex;flex-direction:column;gap:24px}
.setup h3{font-size:24px}
.setup .lbl{font-weight:600;color:var(--black);font-size:15px;margin-bottom:10px;display:block}

/* Brief & room */
.brief{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1.5px solid var(--black);margin-top:40px}
.facts > div{padding:20px 20px 0 0}
.facts > div + div{padding-left:20px;border-left:1px solid var(--line)}
.facts .k{font-size:14px;color:var(--mute);margin-bottom:6px}
.facts p{font-family:var(--disp);font-size:21px;font-weight:600;color:var(--black);line-height:1.2}
.scale{display:flex;flex-direction:column;gap:12px}
.scale input[type=range]{width:100%;accent-color:var(--ember);height:28px}
.scale .val{font-family:var(--disp);font-size:64px;font-weight:700;line-height:.9;color:var(--black)}
.scale .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.calmnote{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink);padding-top:18px;border-top:1px solid #D7DEE2}
.calmnote svg{flex-shrink:0;color:var(--leaf);margin-top:2px}
.stage{border-radius:var(--r-xl);background:var(--black);min-height:420px;display:grid;grid-template-columns:2fr 1fr;overflow:hidden;margin-top:32px}
.stage > div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#AEB8BE;padding:32px;text-align:center}
.stage > div + div{background:#15191B}
.stage b{color:#fff;font-family:var(--disp);font-size:22px;font-weight:600}
.avatar{width:120px;height:120px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:40px;color:var(--black)}
.notice{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-top:24px;padding:22px 26px;border-radius:var(--r-m);background:var(--fog)}

/* Debrief */
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding-bottom:40px;border-bottom:1.5px solid var(--black)}
.phase{display:grid;grid-template-columns:72px minmax(0,1fr);gap:24px;padding:44px 0;border-bottom:1px solid var(--line)}
.phase .n{font-family:var(--disp);font-weight:700;font-size:48px;line-height:.85;color:var(--cyan)}
.phase h2{margin-bottom:24px}
.react{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.nscale{position:relative;height:66px;margin-top:34px}
.nscale .track{position:absolute;left:0;right:0;top:28px;height:4px;border-radius:4px;background:var(--line)}
.nscale .span{position:absolute;top:28px;height:4px;background:linear-gradient(90deg,var(--cyan),var(--ember))}
.nscale .dot{position:absolute;top:16px;width:28px;height:28px;margin-left:-14px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1.5px currentColor;display:flex;align-items:center;justify-content:center}
.nscale .dot span{position:absolute;top:34px;}
.nscale .dot.b span{top:-30px}
.nscale .dot span{font-size:13px;font-weight:600;white-space:nowrap}
.nscale .ticks{position:absolute;left:0;right:0;top:-2px;display:flex;justify-content:space-between;font-size:12px;color:#9AA3A9}
.moments{list-style:none;margin:0;padding:0;position:relative}
.moments::before{content:"";position:absolute;left:47px;top:12px;bottom:12px;width:2px;background:var(--line)}
.mo{display:grid;grid-template-columns:36px 24px minmax(0,1fr);gap:0 16px;padding:12px 0}
.mo .tm{font-size:13px;font-weight:600;color:var(--mute);padding-top:3px;font-variant-numeric:tabular-nums}
.mo .mk{width:24px;height:24px;border-radius:50%;border:3px solid #fff;position:relative;z-index:1;margin-top:1px}
.mo .mk.strong{background:var(--leaf)}.mo .mk.wobble{background:var(--ember)}.mo .mk.twist{background:var(--cyan)}
.mo details summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.mo details summary::-webkit-details-marker{display:none}
.mo summary b{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--black);line-height:1.2}
.mo details[open] summary b{color:var(--cyan-ink)}
.mo .body{padding:10px 0 6px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mo .body p{color:var(--ink);max-width:60ch}
.skills{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.sk{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:16px;align-items:center;padding:10px 0}
.sk span{font-weight:600;color:var(--black)}
.sk b{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--black);text-align:right}
.meter{height:10px;border-radius:10px;background:var(--fog);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:var(--black)}
.meter i.low{background:var(--ember)}
.meter s{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan)}
.kc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kc > div{padding:26px;border-radius:var(--r-m);display:flex;flex-direction:column;gap:10px}
.kc .keep{background:var(--leaf-mist)}
.kc .chg{background:var(--ember-mist)}
.kc .k{font-weight:700;font-size:15px}
.kc .keep .k{color:var(--leaf)}.kc .chg .k{color:var(--ember-ink)}
.kc p{font-family:var(--disp);font-size:24px;font-weight:600;color:var(--black);line-height:1.15}

/* Progress */
.lvlpath{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.lvlpath li{padding:0 16px 0 0;display:flex;flex-direction:column;gap:6px;position:relative}
.lvlpath .bar{height:6px;border-radius:6px;background:var(--line);margin-bottom:12px;overflow:hidden}
.lvlpath .bar i{display:block;height:100%;background:var(--black)}
.lvlpath .bar.now i{background:var(--cyan)}
.lvlpath b{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--black);line-height:1.1}
.lvlpath .n{font-size:14px;color:var(--mute);font-weight:600}
.lvlpath li.off b{color:#9AA3A9}
.lvlpath p{font-size:14px;color:var(--mute)}
.secrow{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.secrow svg{color:var(--cyan-ink)}
.secrow .nm{display:flex;flex-direction:column;gap:6px;min-width:0}
.secrow .nm span{font-weight:600;color:var(--black);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secrow b{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--black);text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:24px}
.bdg{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:15px;font-weight:600;color:var(--black);line-height:1.25}
.bdg i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--black);color:var(--cyan)}
.bdg.off{color:#9AA3A9}
.bdg.off i{background:var(--fog);color:#B5BDC2}

/* Profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
.side{background:var(--fog);border-radius:var(--r-xl);padding:30px;display:flex;flex-direction:column;gap:16px}

.foot{border-top:1px solid var(--line)}
.foot-in{max-width:1180px;margin:0 auto;padding:20px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--black);color:#fff;padding:14px 22px;border-radius:999px;font-weight:600;z-index:40;display:flex;gap:10px;align-items:center}
.toast svg{color:var(--cyan)}

@media (max-width:980px){
  .land,.sclayout,.brief,.prof{grid-template-columns:1fr}
  .authbox,.setup{position:static}
  .plans{grid-template-columns:1fr}
  .plan + .plan{border-left:0;border-top:1.5px solid var(--black)}
  .count{grid-template-columns:1fr}
  .two{grid-template-columns:1fr;gap:48px}
  .react,.skills{grid-template-columns:1fr}
}
@media (max-width:720px){
  .top{backdrop-filter:none;background:#fff}
  body{padding-bottom:72px}
  .top-in{padding:6px 16px;gap:12px}
  .brand img{width:44px;height:44px}
  .brand span{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;margin:0;padding:0 4px env(safe-area-inset-bottom);z-index:30}
  .nav button{flex-direction:column;gap:3px;padding:10px 4px 12px;font-size:12px;flex:1}
  .nav button[aria-current="page"]::after{top:-1px;bottom:auto;left:28%;right:28%;border-radius:0 0 3px 3px}
  .langs{margin-left:auto}
  .page{padding:32px 16px 64px}
  .land{padding:24px 16px 56px;gap:40px}
  .land .intro .bigmark{width:96px;height:96px}
  .why{grid-template-columns:1fr}
  .authbox,.setup,.side{padding:24px}
  .rehearse{grid-template-columns:1fr;padding:28px}
  .rehearse h2{font-size:34px}
  .rehearse svg.deco{display:none}
  .ready{flex-direction:column;align-items:flex-start}
  .facts{grid-template-columns:1fr}
  .facts > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .facts > div{padding:16px 0}
  .stage{grid-template-columns:1fr;min-height:0}
  .dhead{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr;gap:12px;padding:32px 0}
  .kc{grid-template-columns:1fr}
  .sk{grid-template-columns:110px minmax(0,1fr) 34px}
  .lvlpath{grid-template-columns:1fr;gap:18px}
  .scn{grid-template-columns:44px minmax(0,1fr);padding:18px 12px}
  .scn .ico{width:44px;height:44px}
  .scn .meta{grid-column:2;flex-direction:row;align-items:center}
  .toast{bottom:86px}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<footer class="foot"><div class="foot-in"><span id="footnote"></span><button class="link small" data-act="reset" id="resetbtn"></button></div></footer>

/* Brand arcs: open on the right like the logo */
function arcs(vals,size,draw){
  size=size||240;const sw=Math.round(size*.07),gap=sw*1.25;const cols=["#00AEEF","#000000","#86CEF4"];
  let out="";vals.forEach((v,i)=>{const r=size/2-sw/2-i*(sw+gap);const c=2*Math.PI*r;const len=c*.8;const val=len*Math.max(0,Math.min(1,v));
   out+=`<circle cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="#EDF0F2" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" transform="rotate(36 ${size/2} ${size/2})"/>`+
        `<circle class="v" cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="${cols[i]}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.max(.1,val).toFixed(1)} ${c.toFixed(1)}" transform="rotate(36 ${size/2} ${size/2})"/>`;});
  return `<svg class="arcs ${draw?"draw":""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${out}</svg>`;
}
const DECO=`<svg class="deco" viewBox="0 0 400 400" aria-hidden="true"><path d="M318 82A168 168 0 1 0 318 318" fill="none" stroke="#00AEEF" stroke-width="22" stroke-linecap="round"/><path d="M290 112A128 128 0 1 0 290 288" fill="none" stroke="#2A3135" stroke-width="18" stroke-linecap="round"/><path d="M262 142A88 88 0 1 0 262 258" fill="none" stroke="#86CEF4" stroke-width="16" stroke-linecap="round"/></svg>`;

/* Nerves chart: dumbbell before → after */
function nervesChart(items){
  const w=560,h=220,pl=34,pr=16,pt=16,pb=34,n=items.length;
  const x=i=>pl+(n<2?(w-pl-pr)/2:i*(w-pl-pr)/(n-1));const y=v=>pt+(10-v)/9*(h-pt-pb);
  let g="";[1,4,7,10].forEach(v=>{g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EDF0F2"/><text x="${pl-12}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#8A949A">${v}</text>`;});
  items.forEach((s,i)=>{const X=x(i);g+=`<line x1="${X}" x2="${X}" y1="${y(s.nb)}" y2="${y(s.na)}" stroke="#C9D1D6" stroke-width="3"/><circle cx="${X}" cy="${y(s.nb)}" r="8" fill="#E8590C"/><circle cx="${X}" cy="${y(s.na)}" r="8" fill="#00AEEF"/><text x="${X}" y="${h-10}" text-anchor="${i===0&&n>1?"start":i===n-1&&n>1?"end":"middle"}" font-size="12" fill="#667078">${day(s.date)}</text>`;});
  const lbl=items.map(s=>`${day(s.date)}: ${s.nb} → ${s.na}`).join(", ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(t("nervesT")+". "+lbl)}">${g}</svg>
  <div class="row small mute" style="gap:20px;margin-top:8px"><span class="row" style="gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:#E8590C;display:inline-block"></i>${t("before")}</span><span class="row" style="gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:#00AEEF;display:inline-block"></i>${t("after")}</span></div>`;
}
function skillLine(items){
  const w=560,h=200,pl=8,pr=8,pt=26,pb=28,n=items.length;
  const x=i=>pl+(n<2?(w-pl-pr)/2:i*(w-pl-pr)/(n-1));const y=v=>pt+(100-Math.max(40,v))/60*(h-pt-pb);
  const pts=items.map((s,i)=>[x(i),y(ov(s.m))]);const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${items.map(s=>ov(s.m)).join(", ")}"><path d="${path}" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?7:4.5}" fill="${i===n-1?"#00AEEF":"#fff"}" stroke="#000" stroke-width="2"/><text x="${Math.min(w-16,Math.max(16,p[0]))}" y="${p[1]-14}" text-anchor="middle" font-size="15" font-weight="600" font-family="Barlow Semi Condensed,Arial" fill="#000">${ov(items[i].m)}</text><text x="${p[0]}" y="${h-6}" text-anchor="${i===0&&n>1?"start":i===n-1&&n>1?"end":"middle"}" font-size="12" fill="#667078">${day(items[i].date)}</text>`).join("")}</svg>`;
}

         <input id="nb" type="range" min="1" max="10" step="1" value="${S.nb}" data-range="nb">
         <div class="ends"><span>${t("relaxed")}</span><span>${t("veryN")}</span></div></div>
       <p class="calmnote">${ic("heart",20)}<span>${t("safe")}</span></p>
       <button class="btn btn-k" data-go="room">${ic("play",16)} ${t("enter")}</button>
     </div>
   </div>
  </div>`;
}

function vRoom(){
  const s=scById(S.sel.sc),vr=S.sel.mode==="VR";
  return `<div class="page">
   <button class="back" data-go="brief">${ic("back",18)} ${t("briefT")}</button>
   <h1 style="font-size:clamp(34px,4vw,52px)">${L(s.t)}</h1>
   <div class="stage"><div><span class="avatar">${vr?ic("vr",48,1.8):"AI"}</span><b>${vr?t("room"):t("ai")}</b><span>${L(s.who)}</span></div><div>${ic(vr?"vr":"cam",56,1.5)}<b>${vr?t("headset"):t("cam")}</b></div></div>
   <div class="notice"><div class="row" style="gap:14px;flex:1 1 300px"><span class="tag e">${t("soon")}</span><span style="color:var(--black)">${t("notActive")}</span></div><button class="btn btn-k" data-act="sim">${t("finish")}</button></div>
  </div>`;
}

function vDebriefs(){
  const items=list().reverse().filter(s=>S.filter==="All"||s.sc===S.filter);const used=[...new Set(S.ss.map(s=>s.sc))];
  return `<div class="page">
   <div class="section-h" style="margin-bottom:28px"><h1>${t("debT")}</h1><button class="btn btn-k" data-go="scenarios">${ic("play",16)} ${t("startR")}</button></div>
   <div class="row" style="margin-bottom:24px" role="group"><button class="chipbtn" aria-pressed="${S.filter==="All"}" data-act="filter" data-v="All">${t("all")}</button>${used.map(id=>`<button class="chipbtn" aria-pressed="${S.filter===id}" data-act="filter" data-v="${id}">${L(scById(id).t)}</button>`).join("")}</div>
   <div>${items.map(drow).join("")}</div>
  </div>`;
}

function vDebrief(){
  const s=S.ss.find(x=>x.id===S.cur)||last(),sc=scById(s.sc),items=list(),k=items.findIndex(x=>x.id===s.id),p=k>0?items[k-1]:null,v=ov(s.m),w=weakest(s.m);
  const pos=n=>((n-1)/9*100).toFixed(1)+"%";const lo=Math.min(s.nb,s.na),hi=Math.max(s.nb,s.na);
  const kindLbl={strong:t("strong"),wobble:t("wobble"),twist:t("tw")};
  const nextId=nextPlan();
  return `<div class="page">
   <button class="back" data-go="debriefs">${ic("back",18)} ${t("debriefs")}</button>
   <header class="dhead">
     <div><p class="mute" style="font-size:18px">${longDay(s.date)}</p><h1 style="margin-top:10px">${L(sc.t)}</h1>
       <div class="row" style="margin-top:18px"><span class="tag">${t(s.pr)}</span><span class="tag">${dn("lang",s.language)}</span><span class="tag">${s.mode==="VR"?"VR / 360":t("webcam")}</span><span class="tag">${t("min",{n:s.minutes})}</span></div></div>
     <div class="row" style="gap:16px;align-items:flex-end"><span style="font-family:var(--disp);font-weight:700;font-size:96px;line-height:.8;color:var(--black)">${v}</span><span class="stack" style="gap:4px;padding-bottom:4px"><span class="mute small">${t("overall")}</span>${p?`<span class="tag ${v-ov(p.m)>=0?"l":"e"}">${v-ov(p.m)>=0?"+":""}${v-ov(p.m)} ${t("vsPrev")}</span>`:""}</span></div>
   </header>

   <section class="phase"><span class="n">1</span><div><h2>${t("p1")}</h2>
     <div class="react">
       <div class="stack g-m">
         <div class="nscale" aria-hidden="true"><div class="ticks"><span>1</span><span>10</span></div><div class="track"></div><div class="span" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>
           <span class="dot b" style="left:${pos(s.nb)};background:#E8590C;color:#E8590C"><span>${t("before")} ${s.nb}</span></span><span class="dot" style="left:${pos(s.na)};background:#00AEEF;color:#00AEEF"><span>${t("after")} ${s.na}</span></span></div>
         <div class="scale" style="margin-top:20px"><label for="na" style="font-weight:600;color:var(--black)">${t("feelNow")}</label><input id="na" type="range" min="1" max="10" value="${s.na}" data-range="na" data-id="${s.id}"><div class="ends"><span>${t("relaxed")}</span><span>${t("veryN")}</span></div></div>
       </div>
       <div class="field"><label for="hard">${t("hardest")}</label><textarea id="hard" data-note="${s.id}" placeholder="${esc(t("hardestPh"))}">${esc(s.note||"")}</textarea></div>
     </div></div></section>

   <section class="phase"><span class="n">2</span><div><div class="section-h" style="margin-bottom:12px"><h2 style="margin:0">${t("p2")}</h2><span class="small mute">${t("tapMoment")}</span></div>
     <ol class="moments">${s.mo.map((m,i)=>`<li class="mo"><span class="tm">${m[0]}</span><span class="mk ${m[1]}"></span><details ${i===0?"open":""}><summary><b>${esc(L(m[2]))}</b><span class="tag ${m[1]==="strong"?"l":m[1]==="wobble"?"e":"c"}">${kindLbl[m[1]]}</span></summary><div class="body"><p>${esc(L(m[3]))}</p>${m[1]!=="strong"?`<button class="link" data-act="again" data-v="${s.id}">${ic("repeat",16)} ${t("rehearseMoment")}</button>`:""}</div></details></li>`).join("")}</ol></div></section>

   <section class="phase"><span class="n">3</span><div><h2>${t("p3")}</h2>
     <div>${MET.map(key=>`<div class="sk"><span>${dn("metric",key)}</span><div class="meter"><i class="${key===w?"low":""}" style="width:${s.m[key]}%"></i>${p?`<s style="left:${p.m[key]}%" title="${t("prevMark")}"></s>`:""}</div><b>${s.m[key]}</b></div>`).join("")}</div>
     ${p?`<p class="small mute row" style="gap:8px;margin-top:10px"><i style="width:2px;height:14px;background:#00AEEF;display:inline-block"></i>${t("prevMark")}</p>`:""}</div></section>

   <section class="phase" style="border-bottom:0"><span class="n">4</span><div><h2>${t("p4")}</h2>
     <div class="kc"><div class="keep"><span class="k">${t("keep")}</span><p>${esc(L(s.keep))}</p></div><div class="chg"><span class="k">${t("try")}</span><p>${esc(L(s.chg))}</p></div></div>
     <div class="row" style="gap:12px;margin-top:28px"><button class="btn btn-k" data-act="again" data-v="${s.id}">${ic("repeat",16)} ${t("again")}</button>${nextId!==s.sc?`<button class="btn btn-o" data-act="pick" data-v="${nextId}" data-next="brief">${t("nextPlan")}: ${L(scById(nextId).t)}</button>`:""}</div></div></section>
  </div>`;
}

function vProgress(){
  const L1=lvl(),items=list(),f=items[0],l=last();
  const sectors=[...new Set([S.user.sector,...S.user.past])].map(sec=>{const tasks=S.ss.filter(s=>s.sc==="task");return {sec,val:sec===S.user.sector&&tasks.length?Math.round(tasks.reduce((a,s)=>a+ov(s.m),0)/tasks.length):null};});
  const badges=[["b1","star",S.ss.length>=1],["b2","fire",S.ss.length>=5],["b3","pause",doneSc("quiet")],["b4","swap",doneSc("switch")],["b5","bolt",S.ss.some(s=>ov(s.m)>=75)],["b6","panel",S.ss.some(s=>s.pr==="tough")],["b7","heart",S.ss.some(s=>s.nb-s.na>=3)],["b8","vr",S.ss.some(s=>s.mode==="VR")]];
  return `<div class="page stack" style="gap:72px">
   <div class="section-h" style="margin:0"><h1>${t("progress")}</h1><span class="mute" style="font-size:18px">${L1.xp} XP, ${S.ss.length} ${t("rehearsals")}</span></div>
   <section><div class="section-h"><h2>${t("levels")}</h2><span class="small mute">${L1.n?t("xpTo",{x:L1.n.xp-L1.xp,n:dn("lvl",L1.n.n)}):t("top")}</span></div>
     <ol class="lvlpath">${LEVELS.map(x=>{const st=x.n<L1.c.n?"done":x.n===L1.c.n?"now":"off";const w=st==="done"?100:st==="now"?Math.max(6,L1.pct):0;return `<li class="${st}"><div class="bar ${st==="now"?"now":""}"><i style="width:${w}%"></i></div><span class="n">${t("lvl")} ${x.n}, ${x.xp} XP</span><b>${dn("lvl",x.n)}</b><p>${dn("unlock",x.n)}</p></li>`;}).join("")}</ol></section>
   <div class="two">
     <section><div class="section-h"><h2>${t("nervesT")}</h2></div>${nervesChart(items)}</section>
     <section><div class="section-h"><h2>${t("skills")}</h2></div>${skillLine(items)}
       <div style="margin-top:14px">${MET.map(k=>{const c=l.m[k]-f.m[k];return `<div class="sk"><span>${dn("metric",k)}</span><div class="meter"><i style="width:${l.m[k]}%"></i></div><b>${l.m[k]}</b></div>`;}).join("")}</div>
       <p class="small mute" style="margin-top:8px">+${ov(l.m)-ov(f.m)} ${t("sinceStart")}</p></section>
   </div>
   <div class="two">
     <section><div class="section-h"><h2>${t("sectors")}</h2><button class="link" data-go="profile">${t("change")}</button></div>
       ${sectors.map(r=>`<div class="secrow">${ic(sKey(r.sec),22)}<div class="nm"><span>${dn("sector",r.sec)} <span class="tag ${r.sec===S.user.sector?"c":""}">${r.sec===S.user.sector?t("current"):t("previous")}</span></span>${r.val!==null?`<div class="meter"><i style="width:${r.val}%"></i></div>`:""}</div><b>${r.val!==null?r.val:""}</b></div>`).join("")}</section>
     <section><div class="section-h"><h2>${t("scenarios")}</h2></div>
       ${SC.map(s=>{const a=S.ss.filter(x=>x.sc===s.id);const v=a.length?Math.round(a.reduce((q,x)=>q+ov(x.m),0)/a.length):null;return `<div class="secrow">${ic(scUnlocked(s)?s.ic:"lock",22)}<div class="nm"><span>${L(s.t)}</span>${v!==null?`<div class="meter"><i style="width:${v}%"></i></div>`:""}</div><b>${v!==null?v:`<span class="small mute" style="font-family:var(--body);font-weight:400">${scUnlocked(s)?"":t("unlockAt",{n:s.lvl})}</span>`}</b></div>`;}).join("")}</section>
   </div>
   <section><div class="section-h"><h2>${t("badges")}</h2></div><div class="badges">${badges.map(([k,i,ok])=>`<div class="bdg ${ok?"":"off"}"><i>${ic(ok?i:"lock",24)}</i>${dn("badge",k)}</div>`).join("")}</div></section>
  </div>`;
}

function vProfile(){
  const u=S.user;const pn={free:t("free"),sprint:t("sprint"),monthly:t("monthly")}[S.plan]||"";
  return `<div class="page">
   <div class="section-h" style="margin-bottom:44px"><div class="row" style="gap:20px"><span class="me" style="width:76px;height:76px;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:default">${esc(ini(u.name))}</span><div><h1 style="font-size:44px">${esc(u.name)}</h1><p class="mute">${esc(u.email)}</p></div></div><button class="btn btn-o" data-act="logout">${t("logout")}</button></div>
   <div class="prof">
     <form id="prof" class="stack" style="gap:40px">
       <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px">
         <div class="field"><label for="p-n">${t("name")}</label><input id="p-n" value="${esc(u.name)}"></div>
         <div class="field"><label for="p-r">${t("position")}</label><input id="p-r" value="${esc(u.role)}"></div>
         <div class="field"><label for="p-c">${t("company")}</label><input id="p-c" value="${esc(u.company)}"></div>
         <div class="field"><label for="p-d">${t("date")}</label><input id="p-d" type="date" value="${esc(u.date||"")}"></div>
       </div>
       <div class="stack g-m"><h3>${t("curSector")}</h3>${sectorTiles(u.sector,"usector")}</div>
       <div class="stack g-m"><h3>${t("prevSectors")}</h3><div class="row">${SECTORS.filter(s=>s[1]!==u.sector).map(([k,f])=>`<button type="button" class="chipbtn" aria-pressed="${u.past.includes(f)}" data-act="past" data-v="${esc(f)}">${dn("sector",f)}</button>`).join("")}</div></div>
       <div class="stack g-m"><h3>${t("defLang")}</h3><div class="seg">${LANGS.map(x=>`<button type="button" aria-pressed="${u.language===x}" data-act="ulang" data-v="${x}">${dn("lang",x)}</button>`).join("")}</div></div>
       <button class="btn btn-k" type="submit" style="align-self:flex-start">${t("save")}</button>
     </form>
     <aside class="side"><p class="small mute">${t("plan")}</p><h3>${pn}</h3><p class="mute">${t("vrState",{s:S.vr?t("on"):t("off")})}</p><button class="btn btn-o" data-go="plans">${t("plans")}</button></aside>
   </div>
  </div>`;
}

/* ============ Router ============ */
let lastRoute=null;
function render(){
  if(!S.logged)S.route="login";else if(!S.plan&&S.route!=="plans")S.route="plans";
  const changed=S.route!==lastRoute,y=window.scrollY;
  const ae=document.activeElement,fd=ae&&ae.dataset&&ae.dataset.act?{act:ae.dataset.act,k:ae.dataset.k,v:ae.dataset.v}:null;
  renderTop();
  const V={login:vLogin,plans:vPlans,setup:vSetup,today:vToday,scenarios:vScenarios,brief:vBrief,room:vRoom,debriefs:vDebriefs,debrief:vDebrief,progress:vProgress,profile:vProfile};
  $("#app").innerHTML=(V[S.route]||vToday)(changed);
  save();
  if(changed){window.scrollTo(0,0);lastRoute=S.route;}
  else{window.scrollTo(0,y);if(fd){const sel=`[data-act="${fd.act}"]`+(fd.k?`[data-k="${fd.k}"]`:"")+(fd.v?`[data-v="${CSS.escape(fd.v)}"]`:"");const el=document.querySelector(sel);if(el)el.focus({preventScroll:true});}}
}
const go=r=>{S.route=r;render();};

function simulate(){
  const sel=S.sel,b=last().m,adj={calm:3,real:0,tough:-6}[sel.pr],r=()=>Math.round(Math.random()*8)-2,c=v=>Math.max(35,Math.min(96,v));
  const m={confidence:c(b.confidence+r()+adj),clarity:c(b.clarity+r()+adj),communication:c(b.communication+r()+adj),quality:c(b.quality+r()+adj+1)};
  const sc=scById(sel.sc);const p=POOL.slice().sort(()=>Math.random()-.5).slice(0,3);
  const mo=[["0:30",p[0][0],p[0][1],p[0][2]],["3:10","twist",sc.tw,m3("You handled the twist. Next time take a breath before answering.","Selvisit yllätyksestä. Hengitä ensi kerralla ennen vastausta.","Superaste el giro. La próxima vez respira antes de responder.")],["6:40",p[1][0],p[1][1],p[1][2]],["9:50",p[2][0],p[2][1],p[2][2]]];
  const na=Math.max(1,S.nb-1-Math.floor(Math.random()*3));
  const it={id:"s"+Date.now(),date:addDays(0),sc:sel.sc,pr:sel.pr,language:sel.language,mode:sel.mode,minutes:sc.min+Math.round(Math.random()*3)-1,nb:S.nb,na,m,note:"",mo,keep:KEEP[Math.floor(Math.random()*2)],chg:CHG[weakest(m)]};
  const before=lvl().c.n;S.ss.push(it);S.cur=it.id;const after=lvl().c;
  go("debrief");toast(after.n>before?t("tLevel",{n:dn("lvl",after.n)}):`+${xpOf(it)} XP`);
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return;}
  const a=e.target.closest("[data-act]");if(!a)return;const v=a.dataset.v;
  switch(a.dataset.act){
   case "lang":S.lang=v;render();break;
   case "tab":S.tab=v;render();break;
   case "guest":S.logged=true;S.user.name=t("guestName");if(!S.plan)S.plan="sprint";go("today");break;
   case "plan":{const first=!S.plan;S.plan=v;toast(t("tPlan",{p:t(v==="free"?"free":v==="sprint"?"sprint":"monthly")}));go(first?"setup":"today");break;}
   case "vr":S.vr=!S.vr;if(!S.vr&&S.sel.mode==="VR")S.sel.mode="Webcam";render();toast(S.vr?t("tVrOn"):t("tVrOff"));break;
   case "nodate":S.user.date=null;go("today");break;
   case "usector":S.user.sector=v;S.user.past=S.user.past.filter(s=>s!==v);render();break;
   case "past":S.user.past=S.user.past.includes(v)?S.user.past.filter(s=>s!==v):S.user.past.concat([v]);render();break;
   case "ulang":S.user.language=v;render();break;
   case "sel":S.sel[a.dataset.k]=v;render();break;
   case "pick":S.sel.sc=v;S.sel.language=S.user.language;if(!prUnlocked(S.sel.pr))S.sel.pr="calm";go(a.dataset.next||"scenarios");break;
   case "open":S.cur=v;go("debrief");break;
   case "filter":S.filter=v;render();break;
   case "again":{const s=S.ss.find(x=>x.id===v);Object.assign(S.sel,{sc:s.sc,pr:s.pr,language:s.language,mode:S.vr?s.mode:"Webcam"});go("brief");break;}
   case "sim":simulate();break;
   case "logout":S.logged=false;S.tab="login";render();break;
   case "reset":{const k=S.logged,l=S.lang;S=fresh(l);if(k){S.logged=true;S.plan="sprint";S.route="today";}lastRoute=null;render();toast(t("tReset"));break;}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.range==="nb"){S.nb=+el.value;const o=$("#nbv");if(o)o.firstChild.nodeValue=el.value;save();}
  if(el.dataset.range==="na"){const s=S.ss.find(x=>x.id===el.dataset.id);if(s){s.na=+el.value;save();}}
  if(el.dataset.note){const s=S.ss.find(x=>x.id===el.dataset.note);if(s){s.note=el.value;save();}}
});
document.addEventListener("change",e=>{if(e.target.dataset.range==="na")render();});
document.addEventListener("submit",e=>{
  e.preventDefault();const id=e.target.id;
  if(id==="auth"){const n=$("#a-n"),m=$("#a-e");if(n&&n.value.trim())S.user.name=n.value.trim();if(m&&m.value.trim())S.user.email=m.value.trim();S.logged=true;if(S.tab==="signup"){S.plan=null;go("plans");}else{if(!S.plan)S.plan="sprint";go("today");}}
  if(id==="setup"){S.user.date=$("#u-d").value||null;S.user.role=$("#u-r").value.trim()||S.user.role;S.user.company=$("#u-c").value.trim();go("today");}
  if(id==="prof"){S.user.name=$("#p-n").value.trim()||S.user.name;S.user.role=$("#p-r").value.trim()||S.user.role;S.user.company=$("#p-c").value.trim();S.user.date=$("#p-d").value||null;render();toast(t("tSaved"));}
});
render();
</script>
</body>
</html>
